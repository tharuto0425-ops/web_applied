<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>星を並べる</title>
  </head>
  <body>
    <h2>★を並べる</h2>
    <input type="number" id="starCount" />
    <button onclick="printStars()">表示</button>
    <p id="stars"></p>

    <script>
      function printStars() {
        const count = Number(document.getElementById("starCount").value);

        let result = "";
        if (0 < count){
            for (let i = 1; i <= count; i++) {
                if (i<=20) {
                    if (i%2==1){
                            result += "★";
                    } else {
                        result += "☆";
                    }
                    if (i%5==0) {
                        result += " ";
                    }
                }
            } 
        } else {
            result = "1以上の数を入れてください";
        }

        document.getElementById("stars").innerText = result;
      }
    </script>
  </body>
</html>
