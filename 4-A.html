<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>押しっぱなしと同時押し</title>
    <style>
      .stage {
        position: relative;
        width: 600px;
        height: 240px;
        margin: 24px auto;
        border: 4px solid #333;
        border-radius: 12px;
        background: linear-gradient(to bottom, #e0f2fe, #f0f9ff);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      /* === キャラクターの見た目（スライム風） === */
      #box {
        position: absolute;
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        border-radius: 50% 50% 45% 45%;
        box-shadow: 0 6px 0 #1e40af, inset 0 4px 6px rgba(255, 255, 255, 0.4);
        transition: transform 0.1s ease, background 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 顔パーツ（目と口） */
      .face {
        position: relative;
        width: 30px;
        height: 20px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        transition: transform 0.05s ease;
      }
      .eye {
        width: 8px;
        height: 8px;
        background-color: white;
        border-radius: 50%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .pupil {
        width: 4px;
        height: 4px;
        background-color: #1e293b;
        border-radius: 50%;
        position: absolute;
      }
      .mouth {
        position: absolute;
        bottom: 0px;
        width: 8px;
        height: 4px;
        border-bottom: 2px solid white;
        border-radius: 0 0 8px 8px;
      }

      /* Shiftダッシュ時のスタイル */
      #box.dash {
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        box-shadow: 0 6px 0 #991b1b, 0 0 12px rgba(239, 68, 68, 0.6);
        transform: scale(1.1) rotate(5deg);
      }
    </style>
  </head>
  <body>
    <p style="text-align: center; font-family: sans-serif; font-weight: bold; color: #333;">
      🎮 ← → ↑ ↓ または WASD で移動（Shiftで炎の爆走ダッシュ！）
    </p>

    <div class="stage" id="stage">
      <!-- 顔付きのキャラクター構造 -->
      <div id="box">
        <div class="face" id="face">
          <div class="eye"><div class="pupil" id="pupil1"></div></div>
          <div class="eye"><div class="pupil" id="pupil2"></div></div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>

    <script>
      const box = document.getElementById("box");
      const face = document.getElementById("face");

      let x = 50;
      let y = 96;
      let speed = 4;

      const keys = {};

      document.addEventListener("keydown", (e) => {
        keys[e.code] = true;
      });
      document.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      function draw() {
        box.style.left = x + "px";
        box.style.top = y + "px";

        // 移動方向によって目を移動させるアニメーション演出
        let lookX = 0;
        let lookY = 0;

        if (keys["ArrowRight"] || keys["KeyD"]) lookX = 4;
        if (keys["ArrowLeft"] || keys["KeyA"]) lookX = -4;
        if (keys["ArrowDown"] || keys["KeyS"]) lookY = 3;
        if (keys["ArrowUp"] || keys["KeyW"]) lookY = -3;

        face.style.transform = `translate(${lookX}px, ${lookY}px)`;
      }

      function update() {
        // Shift（左右対応）でダッシュ判定＆デザイン切り替え
        if (keys["ShiftLeft"] || keys["ShiftRight"]) {
          speed = 8;
          box.classList.add("dash"); // 赤い爆走状態にする
        } else {
          speed = 4;
          box.classList.remove("dash");
        }

        if (keys["ArrowRight"] || keys["KeyD"]) x = x + speed;
        if (keys["ArrowLeft"] || keys["KeyA"]) x = x - speed;
        if (keys["ArrowDown"] || keys["KeyS"]) y = y + speed;
        if (keys["ArrowUp"] || keys["KeyW"]) y = y - speed;

        // 壁判定
        if (x < 0) x = 0;
        if (x > 600 - 48) x = 600 - 48;
        if (y < 0) y = 0;
        if (y > 240 - 48) y = 240 - 48;

        draw();
      }

      setInterval(update, 16);
    </script>
  </body>
</html>
